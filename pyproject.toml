[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "casev"
version = "0.1.0"
description = "Cue-augmented interpretable accident severity estimation with a location-aware clearance-time module"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
